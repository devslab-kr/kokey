<!doctype html>
<!-- Dev harness: run the content scripts outside the extension pipeline.
     `chrome.runtime` / `chrome.storage` are stubbed; click the buttons to
     simulate the context menu / Alt+K message. Needs
     `npm run build:extension` first. -->
<meta charset="utf-8">
<title>kokey extension harness</title>
<body style="font:14px system-ui;padding:24px;display:grid;gap:14px;max-width:520px">
  <label>mistyped field <input id="a" value="dkssudgktpdy" style="width:100%;padding:6px"></label>
  <label>nothing to convert <input id="b" value="123" style="width:100%;padding:6px"></label>
  <label>password (suggest button must NOT appear)
    <input id="c" type="password" value="dkssudgktpdy" style="width:100%;padding:6px"></label>
  <p>select me: привет ghbdtn ㅗ디ㅣㅐ</p>
  <button id="fix">simulate kokey-fix (focus a field first)</button>
  <script>
    window.__handlers = []
    const store = {}
    window.chrome = {
      runtime: { onMessage: { addListener: (fn) => window.__handlers.push(fn) } },
      storage: {
        sync: {
          get: (d) => Promise.resolve({ ...d, ...store }),
          set: (p) => { Object.assign(store, p); window.__onChanged?.(); return Promise.resolve() }
        },
        onChanged: { addListener: (fn) => { window.__onChanged = fn } }
      }
    }
  </script>
  <script src="./kokey.global.js"></script>
  <script src="./settings.js"></script>
  <script src="./convert.js"></script>
  <script src="./content.js"></script>
  <script src="./suggest.js"></script>
  <script>
    const fire = () => window.__handlers.forEach((f) => f({ type: 'kokey-fix' }))
    document.getElementById('fix').addEventListener('mousedown', (e) => {
      e.preventDefault()
      fire()
    })
  </script>
</body>
